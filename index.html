 $('#loginbtn',EL).onclick=function(){admin?openPanel():$('#lg').classList.add('open')};
 if(admin)document.body.classList.add('ed'),$$('[data-e]',EL).forEach(function(e){e.contentEditable='true'})}
function card(n,demo){var x='';for(var i=1;i<=10;i++){var rw=i==5?'25%':i==10?'50%':'';x+='<div class="box'+(i<=n?' on':'')+(rw?' rw':'')+'">'+(rw?rw+'<br>dto.':i)+'</div>'}
 return '<div class="lgrid">'+x+'</div>'+(demo?'<div class="lmeta"><span>Ejemplo de tarjeta</span><span>5.ª cita: 25% · 10.ª cita: 50%</span></div>':'')}
function sha(s){return crypto.subtle.digest('SHA-256',new TextEncoder().encode('nv|'+s)).then(function(b){return [].map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2)}).join('')})}
/* --- login --- */
var TOK=null,clients=[],local=false,canPub=true;
function api(p,body,noauth){var o={headers:{'content-type':'application/json'}};if(TOK&&!noauth)o.headers.authorization='Bearer '+TOK;if(body!==undefined){o.method='POST';o.body=JSON.stringify(body)}
 return fetch('/api/'+p,o).then(function(r){if(!r.ok)throw {status:r.status};return r.json()})}
var lg=document.createElement('div');lg.id='lg';lg.innerHTML='<form class="card"><h3 style="font-family:var(--serif);margin:0 0 12px;font-size:1.6rem">Acceso administrador</h3><label>Usuario<input name="u" autocomplete="username"></label><label style="margin-top:10px">Contraseña<input name="p" type="password" autocomplete="current-password"></label><p class="msg" id="lmsg"></p><div class="r" style="display:flex;gap:8px"><button class="btn" type="submit">Entrar</button><button class="btn ghost" type="button" id="lx">Cancelar</button></div></form>';document.body.appendChild(lg);
$('#lx',lg).onclick=function(){lg.classList.remove('open')};
$('form',lg).onsubmit=function(e){e.preventDefault();var f=e.target,m=$('#lmsg',lg);m.textContent='Verificando…';
 api('login',{u:f.u.value,p:f.p.value},true).then(function(r){TOK=r.token;f.p.value='';m.textContent='';lg.classList.remove('open');enter()}).catch(function(x){m.textContent=!x||!x.status?'Sin conexión con el servidor. Revisa que el sitio esté publicado en Netlify.':x.status==401?'Usuario o contraseña incorrectos.':x.status==404?'El servidor no está instalado en este sitio: falta la carpeta netlify/functions en GitHub. Súbela y vuelve a desplegar.':x.status==500?'Falta configurar ADMIN_PASSWORD en Netlify (Environment variables) y volver a desplegar.':'Error del servidor ('+x.status+').'})};
function loadClients(){return api('clients').then(function(c){clients=c;local=false}).catch(function(){local=true;try{clients=JSON.parse(localStorage.getItem('nv_clients')||'[]')}catch(e){clients=[]}})}
function pushClients(){if(!local)return api('clients',clients).catch(function(){});try{localStorage.setItem('nv_clients',JSON.stringify(clients))}catch(e){}return Promise.resolve()}
function saveClient(){return pushClients()}function delClient(){return pushClients()}
function enter(){admin=true;loadClients().then(function(){render();bar();openPanel()})}
/* --- barra y panel --- */
var barEl=document.createElement('div');barEl.id='bar';document.body.appendChild(barEl);
function bar(){barEl.className='on';barEl.innerHTML='<button class="btn" id="b1">Panel de edición</button><button class="btn ghost" id="b2" style="background:var(--surface)">Salir</button>';$('#b1').onclick=openPanel;$('#b2').onclick=function(){location.reload()}}
var P=document.createElement('div');P.id='adm';document.body.appendChild(P);var tab='sitio';
function openPanel(){P.classList.add('open');panel()}
function closePanel(){P.classList.remove('open')}
function readEdits(){$$('[data-e]',EL).forEach(function(e){var k=e.dataset.e,t=e.textContent;if(t!==orig[k]){S.t[k]=t;orig[k]=t}})}
function panel(){
 readEdits();var tabs=['sitio','fidelidad','cuenta'].map(function(t){return '<button class="btn ghost tab'+(t==tab?' on':'')+'" data-t="'+t+'">'+{sitio:'Sitio',fidelidad:'Fidelidad',cuenta:'Cuenta'}[t]+'</button>'}).join('');
 var h='<div class="bg"></div><aside><div class="r" style="justify-content:space-between"><b style="font-family:var(--serif);font-size:1.4rem">Panel de administración</b><button class="btn ghost" id="px">Cerrar</button></div><div class="tabs">'+tabs+'</div>';
 if(tab=='sitio'){h+='<p class="msg">Cierra el panel y toca cualquier texto con borde punteado para editarlo.</p><h3>Colores</h3>'+
  [['accent','Color principal','#8e4a5f'],['bg','Fondo','#fbf5f3'],['soft','Fondo de secciones','#f2e3e0'],['ink','Texto','#2e1f26']].map(function(c){return '<div class="r"><input type="color" data-c="'+c[0]+'" value="'+(S.c[c[0]]||c[2])+'"><span>'+c[1]+'</span></div>'}).join('')+
  '<p class="msg">Fondo y texto aplican al modo claro.</p><h3>Imágenes</h3><div class="r"><button class="btn ghost" id="blogo">Cambiar logo</button></div><h4>Galería</h4><div class="r">'+S.g.map(function(v,i){return '<div class="th" style="background-image:'+(/^var\(/.test(v)?v:'url('+v+')')+'"><button data-d="'+i+'" title="Quitar">×</button></div>'}).join('')+'</div><div class="r"><button class="btn ghost" id="bg">Agregar foto</button></div>'+
  '<h3>Contacto</h3><div class="r"><label style="flex:1">WhatsApp (con código país)<input type="text" id="kwa" value="'+esc(wa())+'"></label></div><div class="r"><label style="flex:1">Instagram (sin @)<input type="text" id="kig" value="'+esc(S.k.ig)+'"></label></div>'}
 if(tab=='fidelidad'){h+='<h3>Clientas</h3><p class="msg">'+(local?'No hay conexión con el servidor: se guarda solo en este dispositivo.':'Datos privados: solo tú puedes verlos.')+'</p><div class="r"><input type="text" id="cn" placeholder="Nombre"><input type="text" id="cp" placeholder="WhatsApp (opcional)"><button class="btn" id="ca">Agregar</button></div>'+clients.map(function(c){var n=c.n||0,d=n==5?'25%':n==10?'50%':'';return '<div class="cli"><div class="r" style="justify-content:space-between"><b>'+esc(c.name)+'</b><span class="msg">'+n+'/10</span></div>'+card(n)+'<div class="r"><button class="btn" data-a="'+c.id+'">Registrar cita</button><button class="btn ghost" data-u="'+c.id+'">Deshacer</button><button class="btn ghost" data-m="'+c.id+'">Enviar por WhatsApp</button><button class="btn ghost" data-x="'+c.id+'">Eliminar</button></div>'+(d?'<p class="msg" style="color:var(--accent);font-weight:600">Cita '+n+': corresponde '+d+' de descuento.</p>':'')+'</div>'}).join('')||'<p class="msg">Aún no hay clientas.</p>'}
 if(tab=='cuenta'){h+='<h3>Acceso</h3><p class="msg">El usuario y la contraseña se cambian en Netlify (Site configuration → Environment variables: ADMIN_USER y ADMIN_PASSWORD) y luego se hace un nuevo deploy.</p>'}
 h+='<h3>Publicar</h3><p class="msg" id="pm">'+(canPub?'Los cambios se ven solo aquí hasta que los publiques.':'Esta sesión no puede publicar. Abre la página desde tu cuenta de Claude.')+'</p><div class="r"><button class="btn" id="pub"'+(canPub?'':' disabled')+'>Publicar cambios</button></div></aside>';
 P.innerHTML=h;
 $('.bg',P).onclick=$('#px',P).onclick=closePanel;
 $$('.tab',P).forEach(function(b){b.onclick=function(){tab=b.dataset.t;panel()}});
 $$('[data-c]',P).forEach(function(i){i.oninput=function(){S.c[i.dataset.c]=i.value;theme()}});
 var f=$('#blogo',P);if(f)f.onclick=function(){pick(function(u){S.img.logo=u;theme();panel()},300)};
 f=$('#bg',P);if(f)f.onclick=function(){pick(function(u){S.g.push(u);render();panel()},900)};
 $$('[data-d]',P).forEach(function(b){b.onclick=function(){S.g.splice(+b.dataset.d,1);render();panel()}});
 var kw=$('#kwa',P),ki=$('#kig',P);if(kw)kw.onchange=function(){S.k.wa=kw.value.replace(/\D/g,'');render()};if(ki)ki.onchange=function(){S.k.ig=ki.value.replace(/^@/,'').trim();render()};
 f=$('#ca',P);if(f)f.onclick=function(){var n=$('#cn',P).value.trim();if(!n)return;var c={id:'c'+Date.now().toString(36),name:n,phone:$('#cp',P).value.replace(/\D/g,''),n:0};clients.push(c);saveClient(c).then(panel)};
 function by(a){return clients.filter(function(c){return c.id==a})[0]}
 $$('[data-a]',P).forEach(function(b){b.onclick=function(){var c=by(b.dataset.a);if(c.n>=10){if(!confirm('La tarjeta está completa. ¿Reiniciarla?'))return;c.n=0}c.n++;saveClient(c).then(panel)}});
 $$('[data-u]',P).forEach(function(b){b.onclick=function(){var c=by(b.dataset.u);c.n=Math.max(0,c.n-1);saveClient(c).then(panel)}});
 $$('[data-x]',P).forEach(function(b){b.onclick=function(){var c=by(b.dataset.x);if(!confirm('¿Eliminar a '+c.name+'?'))return;clients=clients.filter(function(z){return z!==c});delClient(c).then(panel)}});
 $$('[data-m]',P).forEach(function(b){b.onclick=function(){var c=by(b.dataset.m),n=c.n||0,t='Hola '+c.name+', llevas '+n+' de 10 citas en tu tarjeta de fidelidad de Nathyvaes. '+(n<5?'En tu 5.ª cita tendrás 25% de descuento.':n<10?'En tu 10.ª cita tendrás 50% de descuento.':'¡Tu próxima cita tiene 50% de descuento!');window.open('https://wa.me/'+(c.phone||'')+'?text='+encodeURIComponent(t),'_blank')}});
 f=$('#pub',P);if(f)f.onclick=publish}
function pick(cb,max){var i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=function(){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);var png=max==300;cb(png?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(i.files[0])};i.click()}
function publish(){readEdits();var m=$('#pm',P);m.textContent='Publicando…';api('config',{t:S.t,c:S.c,g:S.g,k:S.k,img:S.img}).then(function(){m.textContent='Publicado. Ya lo ve todo el mundo.'}).catch(function(x){m.textContent=x&&x.status==401?'La sesión expiró. Sal e inicia sesión de nuevo.':'No se pudo publicar. Revisa la conexión.'})}
theme();EL.style.opacity=0;EL.style.transition='opacity .25s';render();
var shown=false;function show(){if(!shown){shown=true;EL.style.opacity=1}}
setTimeout(show,2500);
fetch('/api/config').then(function(r){return r.ok?r.json():{}}).then(function(c){['t','c','g','k','img'].forEach(function(k){if(c[k])S[k]=c[k]});theme();render()}).catch(function(){}).then(show);
})();
</script></body></html>
